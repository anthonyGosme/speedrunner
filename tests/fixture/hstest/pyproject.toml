[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hstest"
version = "0.1.0"
description = "Fixture CLI for the speedrunner regression matrix"
requires-python = ">=3.8"

[project.scripts]
hstest = "hstest.cli:main"
hsrun = "hstest.autorun:main"
hstty = "hstest.ttyapp:main"
hsthread = "hstest.threaded:main"
hscf = "hstest.cfmain:main"
hslate = "hstest.latestamp:main"
hslog = "hstest.latelog:main"
hssig = "hstest.sigload:main"
hsstate = "hstest.stateful:main"
hsnoisy = "hstest.noisy:main"

# On a version tag (v0.1.0): static Linux binaries for x86_64 and aarch64,
# as archives and .deb packages, their SHA-256 sums and install.sh,
# published as the GitHub release that
# `curl -fsSL .../install.sh | sh` downloads from. Each archive gets a
# signed build provenance attestation (each .deb too): `gh attestation verify <archive>
# --repo anthonyGosme/speedrunner` checks it was built here, by this
# workflow, from the tagged commit.
name: release

on:
  push:
    tags: ["v*"]

permissions: {}  # each job says what it needs

jobs:
  build:
    permissions:
      contents: read
      id-token: write  # to sign the attestations (Sigstore)
      attestations: write
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm  # native: no cross linker needed
    runs-on: ${{ matrix.runner }}
    env:
      TARGET: ${{ matrix.arch }}-unknown-linux-musl
    steps:
      - uses: actions/checkout@v7
      - name: The tag is the crate's version
        run: test "${GITHUB_REF_NAME#v}" = "$(sed -n 's/^version = "\(.*\)"/\1/p' client/Cargo.toml)"
      - name: Toolchain
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q musl-tools
          rustup target add "$TARGET"
      - name: Node addons (glibc and musl), embedded by the build
        run: docker/node-addons.sh node-addons
      - name: Build
        env:
          SPEEDRUNNER_NODE_ADDONS: ${{ github.workspace }}/node-addons
        run: cargo build --release --locked --manifest-path client/Cargo.toml --target "$TARGET"
      - name: Static, and runs
        run: |
          bin=client/target/$TARGET/release/speedrunner
          file "$bin"
          if ldd "$bin" 2>/dev/null | grep -q '=>'; then echo "not static"; exit 1; fi
          "$bin" --version
          "$bin" init zsh > /dev/null
          for f in node-addons/*.node; do test -s "$f"; done  # both addons built
      - name: Package
        run: |
          name=speedrunner-$TARGET
          mkdir "$name"
          cp "client/target/$TARGET/release/speedrunner" LICENSE-MIT LICENSE-APACHE README.md "$name/"
          tar czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
      - name: Debian package, installed and removed once
        run: |
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          export SOURCE_DATE_EPOCH
          deb=$(packaging/deb.sh "client/target/$TARGET/release/speedrunner" "${GITHUB_REF_NAME#v}" "${{ matrix.arch }}" .)
          sha256sum "$deb" > "$deb.sha256"
          sudo dpkg -i "$deb" && speedrunner --version && test "$(readlink /usr/bin/srr)" = speedrunner
          sudo dpkg -r speedrunner && test ! -e /usr/bin/speedrunner
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            speedrunner-*.tar.gz
            speedrunner_*.deb
      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.arch }}
          path: |
            speedrunner-*.tar.gz*
            speedrunner_*.deb*

  platforms:
    permissions:
      contents: read
    uses: ./.github/workflows/platforms.yml

  publish:
    needs: [build, platforms]
    permissions:
      contents: write  # to create the release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: dist-*  # not platforms' logs, uploaded when a target failed
          merge-multiple: true
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp install.sh dist/
          gh release create "$GITHUB_REF_NAME" dist/* --title "speedrunner $GITHUB_REF_NAME" --generate-notes

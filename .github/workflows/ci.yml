# On every push: the client's unit tests, its static (musl) build as
# releases make it, the five regression suites in the Debian image of
# docker/, as they run on the dev VPS, the Node suite (glibc and musl), the
# stress suite (races) and ShellCheck.
# Other distributions and language versions: platforms.yml.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read  # the jobs only read the repository

jobs:
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: cargo test --locked --manifest-path client/Cargo.toml

  shellcheck:  # install.sh, which users pipe to sh, and the scripts CI runs
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: >-
          docker run --rm -v "$PWD:/mnt:ro" -w /mnt koalaman/shellcheck:v0.10.0
          -S warning install.sh shell/speedrunner.bash packaging/deb.sh packaging/update.sh packaging/apt.sh docker/node-addons.sh docker/run.sh docker/test-all.sh

  musl:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: >-
          docker run --rm -v "$PWD:/src" -w /src/client rust:1-alpine sh -c
          'apk add -q musl-dev && cargo build --locked --release && ./target/release/speedrunner --version'

  node:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: docker/test-all.sh node24 node24-alpine

  stress:  # races: parallel calls while daemons stop, die and go stale
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: STRESS_SECONDS=120 docker/test-all.sh stress stress-node

  suites:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t speedrunner-dev docker
      - run: docker run --rm -t -v "$PWD:/src" speedrunner-dev tests

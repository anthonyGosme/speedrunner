# On every push: the client's unit tests, its static (musl) build as
# releases make it, the five regression suites in the Debian image of
# docker/, as they run on the dev VPS, and the Node suite (glibc and musl).
# Other distributions and language versions: platforms.yml.
name: ci

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: cargo test --locked --manifest-path client/Cargo.toml

  musl:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: >-
          docker run --rm -v "$PWD:/src" -w /src/client rust:1-alpine sh -c
          'apk add -q musl-dev && cargo build --locked --release && ./target/release/speedrunner --version'

  node:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: docker/test-all.sh node24 node24-alpine

  suites:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t speedrunner-dev docker
      - run: docker run --rm -t -v "$PWD:/src" speedrunner-dev tests

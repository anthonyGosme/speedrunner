# The signed APT repository, on this repository's GitHub Pages:
# https://anthonygosme.github.io/speedrunner/apt. Rebuilt from scratch
# from the .deb files of every published release (packaging/apt.sh), so
# that it never depends on a previous deployment, then checked with
# `apt install` in Debian 12 and Ubuntu 24.04.
# Called by release.yml after each release; by hand, it rebuilds it.
#
# Needs the secret APT_SIGNING_KEY (the armored secret key, without
# passphrase), Pages built by GitHub Actions, and the github-pages
# environment open to v* tags (packaging/README.md).
name: apt

on:
  workflow_call:
  workflow_dispatch:

permissions: {}  # each job says what it needs

jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.debs.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: The .deb files of every release, checked against their sums
        id: debs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir debs
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases" \
            -q '.[] | select((.draft or .prerelease) | not) | .assets[]
                | select(.name | test("^speedrunner_.*\\.deb(\\.sha256)?$")) | .browser_download_url' |
          while read -r url; do curl -fsSL --retry 3 -o "debs/${url##*/}" "$url"; done
          cd debs
          ls ./*.deb > /dev/null
          for f in ./*.deb; do test -e "$f.sha256"; done
          sha256sum -c ./*.sha256
          latest=$(gh release view -R "$GITHUB_REPOSITORY" --json tagName -q .tagName)
          echo "version=${latest#v}" >> "$GITHUB_OUTPUT"
      - name: Signing key
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: |
          if [ -z "$APT_SIGNING_KEY" ]; then
            echo "::error::No APT_SIGNING_KEY secret: see packaging/README.md"
            exit 1
          fi
          printf '%s\n' "$APT_SIGNING_KEY" | gpg --batch --import
      - name: Repository
        run: |
          mkdir site
          packaging/apt.sh site/apt debs/*.deb
          cp site/apt/index.html site/index.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    concurrency:  # one deployment at a time, none cancelled
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}apt/
    runs-on: ubuntu-24.04
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  check:
    needs: [build, deploy]
    permissions: {}
    strategy:
      fail-fast: false
      matrix:
        image: ["debian:12", "ubuntu:24.04"]
    runs-on: ubuntu-24.04
    steps:
      - name: apt install from the published repository
        env:
          IMAGE: ${{ matrix.image }}
          VERSION: ${{ needs.build.outputs.version }}
        # Pages' CDN may serve the previous index for up to 10 minutes.
        run: >-
          docker run --rm -e "VERSION=$VERSION" "$IMAGE" bash -ec '
          url=https://anthonygosme.github.io/speedrunner/apt;
          apt-get update -q && apt-get install -yq --no-install-recommends ca-certificates curl;
          install -d -m 0755 /etc/apt/keyrings;
          curl -fsSLo /etc/apt/keyrings/speedrunner.asc "$url/speedrunner.asc";
          curl -fsSLo /etc/apt/sources.list.d/speedrunner.sources "$url/speedrunner.sources";
          for i in $(seq 40); do
            apt-get update -q && apt-cache madison speedrunner | grep -qF " $VERSION " && break;
            echo "waiting for $VERSION in the index"; sleep 15;
          done;
          apt-get install -yq speedrunner;
          speedrunner --version | grep -F "$VERSION";
          test "$(readlink /usr/bin/srr)" = speedrunner'

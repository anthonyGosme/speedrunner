# macOS, Intel and Apple Silicon: the universal client, as release.yml
# publishes it, built once; then on each runner the client's unit tests, the
# Python matrix, the shell, script, Ruby and stress suites, with the runner's
# own Python and Ruby and the Node of nodejs.org, and PHP in a job of its own.
# Also before every release (release.yml).
name: macos

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read  # the jobs only read the repository

jobs:
  universal:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - run: client/macos-universal.sh universal/speedrunner
      - uses: actions/upload-artifact@v7
        with:
          name: speedrunner-macos-universal
          path: universal/speedrunner

  python:
    needs: universal
    strategy:
      fail-fast: false
      matrix:
        # Intel, Apple Silicon. macos-13 is gone and macos-14 retires on
        # 2026-11-02 (actions/runner-images#13518).
        os: [macos-15-intel, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - run: sw_vers && uname -m && python3 --version && bash --version | head -1
      - run: cargo test --locked --manifest-path client/Cargo.toml
      - uses: actions/download-artifact@v8
        with:
          name: speedrunner-macos-universal
          path: ${{ runner.temp }}/bin
      - run: |  # artifacts lose the mode bits
          chmod +x "$RUNNER_TEMP/bin/speedrunner"
          "$RUNNER_TEMP/bin/speedrunner" --version
          echo "HS_BIN=$RUNNER_TEMP/bin/speedrunner" >> "$GITHUB_ENV"
      - name: venvs (hstest, awscli v1)
        run: |
          python3 -m venv "$RUNNER_TEMP/venv-test"
          python3 -m venv "$RUNNER_TEMP/venv-aws"
          cp -r tests/fixture/hstest "$RUNNER_TEMP/hstest-build"
          "$RUNNER_TEMP/venv-test/bin/pip" install -q --no-deps "$RUNNER_TEMP/hstest-build"
          "$RUNNER_TEMP/venv-aws/bin/pip" install -q awscli
          echo "HS_PATH=$RUNNER_TEMP/venv-test/bin:$RUNNER_TEMP/venv-aws/bin" >> "$GITHUB_ENV"
      - name: rbtest gem
        run: |
          cp -r tests/fixture/rbtest "$RUNNER_TEMP/rbtest-build"
          (cd "$RUNNER_TEMP/rbtest-build" && gem build rbtest.gemspec)
          GEM_HOME="$RUNNER_TEMP/gems-rbtest" gem install --local --no-document "$RUNNER_TEMP/rbtest-build/rbtest-0.1.0.gem"
          echo "RB_GEM_HOME=$RUNNER_TEMP/gems-rbtest" >> "$GITHUB_ENV"
      - run: python3 tests/test_matrix.py -v
      - run: python3 tests/test_shell.py -v
      - run: python3 tests/test_scripts.py -v
      - run: python3 tests/test_install.py -v
      - run: ruby --version && python3 tests/test_ruby.py -v
        env:
          HS_PATH: ${{ env.RB_GEM_HOME }}/bin:${{ env.HS_PATH }}
      - run: |  # wherever the image keeps node, which the tests' PATH must have
          echo "NODE_PATH_DIRS=$PWD/tests/fixture/nodetest/bin:$(dirname "$(command -v node)")" >> "$GITHUB_ENV"
      - name: Node suite with the image's Node (on Intel, Homebrew's node@22, without code cache)
        run: node --version && python3 tests/test_node.py -v
        env:
          HS_PATH: ${{ env.NODE_PATH_DIRS }}:${{ env.HS_PATH }}
      - name: Node 24 from nodejs.org
        run: |
          V=v24.22.2 A=$(uname -m | sed 's/x86_64/x64/')
          curl -fsSLO "https://nodejs.org/dist/$V/node-$V-darwin-$A.tar.gz"
          curl -fsSL "https://nodejs.org/dist/$V/SHASUMS256.txt" | grep "node-$V-darwin-$A.tar.gz" | shasum -a 256 -c -
          tar xzf "node-$V-darwin-$A.tar.gz" -C "$RUNNER_TEMP"
          echo "NODE_PATH_DIRS=$PWD/tests/fixture/nodetest/bin:$RUNNER_TEMP/node-$V-darwin-$A/bin" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/node-$V-darwin-$A/bin" >> "$GITHUB_PATH"
      - name: which node, built how (frame names differ without a code cache)
        run: |
          command -v node && node -p "process.execPath + ' ' + JSON.stringify(process.config.variables.node_use_node_code_cache) + ' ' + JSON.stringify(process.config.variables.node_use_node_snapshot)"
          for flag in "" --no-lazy; do node $flag tests/fixture/nodetest/bin/nodetest exit throw 2>&1 | grep -E "extensions|Object\.\.js" || true; done
      - run: node --version && python3 tests/test_node.py -v
        env:
          HS_PATH: ${{ env.NODE_PATH_DIRS }}:${{ env.HS_PATH }}
      - run: python3 tests/test_stress.py -v
        env:
          STRESS_SECONDS: 60
          HS_PATH: ${{ env.RB_GEM_HOME }}/bin:${{ env.NODE_PATH_DIRS }}:${{ env.HS_PATH }}

  php:
    needs: universal
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel, macos-26]
        php: [php@8.4, php]  # php: Homebrew's current, 8.5
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      PHP_FORMULA: ${{ matrix.php }}
    steps:
      - uses: actions/checkout@v7
      - run: brew install "$PHP_FORMULA" && echo "$(brew --prefix "$PHP_FORMULA")/bin" >> "$GITHUB_PATH"
      - run: php -v && php -m | grep -iE '^(ffi|pcntl|posix|zend opcache)$'
      - uses: actions/download-artifact@v8
        with:
          name: speedrunner-macos-universal
          path: ${{ runner.temp }}/bin
      - run: |  # artifacts lose the mode bits
          chmod +x "$RUNNER_TEMP/bin/speedrunner"
          "$RUNNER_TEMP/bin/speedrunner" --version
          echo "HS_BIN=$RUNNER_TEMP/bin/speedrunner" >> "$GITHUB_ENV"
      - run: |
          echo "HS_PATH=$PWD/tests/fixture/phptest/bin:$(brew --prefix "$PHP_FORMULA")/bin" >> "$GITHUB_ENV"
      - run: python3 tests/test_php.py -v
      - name: warm bench, indicative on a shared runner
        run: python3 bench/macos/warm.py "$HS_BIN" 10 "$HS_PATH" -- phptest argv x -- composer --version
        continue-on-error: true
      - if: failure()
        run: tail -n 60 /tmp/hs-matrix-*/run/speedrunner/*.log /tmp/hs-matrix-*/*/run/speedrunner/*.log || true

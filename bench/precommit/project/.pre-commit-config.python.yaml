# The usual hooks, as most projects declare them: each tool in an environment
# of pre-commit's own (language: python), called by its absolute path.
repos:
  - repo: local
    hooks:
      - {id: black, name: black, entry: black, language: python, types: [python], additional_dependencies: [black==26.10.1]}
      - {id: isort, name: isort, entry: isort, args: [--profile, black], language: python, types: [python], additional_dependencies: [isort==9.0.2]}
      - {id: flake8, name: flake8, entry: flake8, args: [--max-line-length, "100"], language: python, types: [python], additional_dependencies: [flake8==7.5.0]}
      - {id: mypy, name: mypy, entry: mypy, language: python, types: [python], additional_dependencies: [mypy==2.4.1]}
